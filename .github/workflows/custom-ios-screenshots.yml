# Personal fork only (not upstream): build NOOPiOS for the iOS Simulator, fill it with the app's own
# synthetic demo data (`--demo-seed`, DEBUG only) and upload one screenshot per screen.
#
# This is the fast way to look at a change: it publishes nothing, installs nothing on a phone and
# uses no real health data. The installable build is custom-ios-build.yml.
name: Custom iPhone screenshots

on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Space-separated screens to capture (blank = the default set). "shell" is the full tab shell.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: custom-ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # iOS 26 Liquid Glass (glassEffect) needs the iOS 26 SDK -> Xcode 26 -> macos-26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          PICK=$(Tools/custom-ios-screenshots.sh pick-sim)
          echo "simulator: $PICK"
          echo "udid=${PICK%% *}" >> "$GITHUB_OUTPUT"
      - name: Build NOOPiOS for the simulator (Debug, unsigned)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination "platform=iOS Simulator,id=$UDID"
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build
      - name: Capture screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          SCREENS: ${{ inputs.screens }}
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app (iphonesimulator) not found"; exit 1; }
          # Word-splitting of $SCREENS is intended: it is a space-separated list of screen names.
          # shellcheck disable=SC2086
          Tools/custom-ios-screenshots.sh capture "$APP" "$UDID" screenshots $SCREENS
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-screenshots
          path: screenshots
          if-no-files-found: error
          retention-days: 14
