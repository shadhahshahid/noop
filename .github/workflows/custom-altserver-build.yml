# Personal fork only (not upstream): build AltServer for macOS from the OFFICIAL AltStore source with
# one line changed, as a stopgap until the AltStore project ships its own fix.
#
# Why: since about 19 Nov 2026 Apple's sign-in server answers HTTP 503 to AltServer, because AltServer
# describes the Mac as "macOS" in the X-MMe-Client-Info header and the server now accepts only
# "Mac OS X" there (altstoreio/AltStore issues 1871 and 1877; fix proposed in pull request 1875).
#
# What this builds: the official repository at one pinned commit (the newest public AltServer
# source, 1.8.2), with that single line changed. The change is applied by exact text match and the
# job fails unless the resulting diff is exactly one line in exactly one file. Nothing else is
# modified, and nothing is published: the app is uploaded as a workflow artifact only.
#
# The result is ad-hoc signed (this fork has no Apple Developer ID), so macOS shows a warning the
# first time it is opened. Its version is "1.8.2-503fix" with a build number above the official
# 1.8.4, so its built-in updater offers only a NEWER official release, never 1.8.4 again.
name: Custom AltServer build (HTTP 503 fix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-altserver-build
  cancel-in-progress: true

env:
  ALTSTORE_REPO: https://github.com/altstoreio/AltStore.git
  # Head of the official `classic` branch: "[AltServer] Updates app version to 1.8.2" (21 Oct 2026).
  ALTSTORE_COMMIT: bbc10d6964185b75a46c6ddd7476ac08df095308
  FIX_FILE: "AltServer/Anisette Data/AnisetteDataManager.swift"

jobs:
  altserver:
    # An Intel runner, so the app is built natively for an Intel Mac.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Fetch the official AltStore source at the pinned commit
        run: |
          set -euo pipefail
          git init -q altstore
          cd altstore
          git remote add origin "$ALTSTORE_REPO"
          git fetch -q --depth 1 origin "$ALTSTORE_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$ALTSTORE_COMMIT" || { echo "not at the pinned commit"; exit 1; }
          git submodule update --init --recursive --depth 1
          git submodule status --recursive
      - name: Apply the one-line fix and prove nothing else changed
        working-directory: altstore
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os
          path = os.environ["FIX_FILE"]
          old = '            let osName = (osVersion.majorVersion < 11) ? "Mac OS X" : "macOS"\n'
          new = '            let osName = "Mac OS X" // Apple\'s sign-in server answers HTTP 503 to "macOS" here (altstoreio/AltStore#1875).\n'
          text = open(path, encoding="utf-8").read()
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected the line to fix exactly once, found it {count} times")
          open(path, "w", encoding="utf-8").write(text.replace(old, new))
          EOF
          git --no-pager diff
          test "$(git diff --numstat | wc -l | tr -d ' ')" = "1" || { echo "more than one file changed"; exit 1; }
          test "$(git diff --numstat | cut -f1,2 | tr '\t' ' ')" = "1 1" || { echo "diff is not exactly one line"; exit 1; }
          test "$(git diff --name-only)" = "$FIX_FILE" || { echo "unexpected file changed"; exit 1; }
          test -z "$(git submodule foreach --quiet --recursive 'git status --porcelain')" || { echo "a dependency was modified"; exit 1; }
      - name: Show the toolchain
        run: |
          xcodebuild -version
          sw_vers
          uname -m
      - name: Build AltServer (Release, ad-hoc signed, Intel)
        working-directory: altstore
        run: >-
          xcodebuild -workspace AltStore.xcworkspace -scheme AltServer -configuration Release
          -destination 'platform=macOS,arch=x86_64'
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER=""
          ENABLE_HARDENED_RUNTIME=NO
          MARKETING_VERSION="1.8.2-503fix" CURRENT_PROJECT_VERSION=102
          build
      - name: Check and package the app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/AltServer.app"
          test -d "$APP" || { echo "AltServer.app not found"; ls "$RUNNER_TEMP/dd/Build/Products" || true; exit 1; }
          BIN="$APP/Contents/MacOS/AltServer"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.rileytestut.AltServer"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"
          lipo -archs "$BIN"
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Signature|flags|TeamIdentifier" || true
          mkdir out
          ditto -c -k --keepParent "$APP" out/AltServer-503fix.zip
          shasum -a 256 out/AltServer-503fix.zip | tee out/AltServer-503fix.zip.sha256
          ls -l out
      - name: Upload the app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: altserver-503fix
          path: out
          if-no-files-found: error
          retention-days: 14
